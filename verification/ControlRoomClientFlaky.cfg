\* Liveness: cooperative network, but send_text may fail FLAKY_MAX times.
\* A non-empty send_queue in CONNECTED eventually empties (per-tick flush).
\* Run: tlc -config <abs path>/ControlRoomClientFlaky.cfg <abs path>/ControlRoomClient.tla
SPECIFICATION FairSpec
CONSTANTS
  AUTH_ATTEMPTS = 2
  MAX_RETRIES = 2
  N = 2
  COOP = TRUE
  FLAKY_MAX = 2
  LOSS_MAX = 0
INVARIANTS
  Safety
  S1_NoPreAuthAppSend
  S2_Fifo
  S3_NoAuthInQueue
  S4_AtLeastOnceSafe
PROPERTIES
  CoopNeverGivesUp
  CoopReachesConnected
  CoopStaysConnected
  QueueDrains
  CoopEventuallyReceived
  CoopEventuallyAcked
