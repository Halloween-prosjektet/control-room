\* Liveness with fairness, cooperative environment (COOP = TRUE).
\* Run: tlc -config ControlRoomClientCoop.cfg ControlRoomClient.tla
SPECIFICATION FairSpec
CONSTANTS
  AUTH_ATTEMPTS = 2
  MAX_RETRIES = 2
  N = 2
  COOP = TRUE
  FLAKY_MAX = 0
INVARIANTS
  Safety
  S1_NoPreAuthAppSend
  S2_Fifo
  S3_NoAuthInQueue
PROPERTIES
  CoopNeverGivesUp
  CoopReachesConnected
  CoopStaysConnected
