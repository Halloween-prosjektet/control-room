\* S4' (at-least-once, liveness) with fair loss: cooperative environment, but the network
\* drops the connection once (LOSS_MAX = 1) and send_text may fail twice. Every given event
\* is eventually received by the server and eventually acked.
\* Run: tlc -config <abs path>/ControlRoomClientRecover.cfg <abs path>/ControlRoomClient.tla
SPECIFICATION FairSpec
CONSTANTS
  AUTH_ATTEMPTS = 2
  MAX_RETRIES = 2
  N = 2
  COOP = TRUE
  FLAKY_MAX = 1
  LOSS_MAX = 1
INVARIANTS
  Safety
  S1_NoPreAuthAppSend
  S2_Fifo
  S3_NoAuthInQueue
  S4_AtLeastOnceSafe
PROPERTIES
  CoopNeverGivesUp
  CoopReachesConnected
  CoopStaysConnected
  QueueDrains
  CoopEventuallyReceived
  CoopEventuallyAcked
