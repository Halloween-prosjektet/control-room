\* FINDING F9 (client). A Pi request is lost; the client does not send it again.
\* Expected: FAIL, deadlock (a player that the server never registered).
SPECIFICATION FairSpec
CONSTANTS
    ROOMS = 3
    RUNS = 2
    KEYS <- KeysDefault
    TARGETS <- TgtDefault
    MAX_SHARES = 0
    MAX_RESTARTS = 0
    MAX_DISC = 0
    MAX_DROPS = 1
    MAX_DUPS = 0
    DROP_REQUESTS = TRUE
    MAX_UP = 1
    RETRY = FALSE
    LEAVES = TRUE
    ARBITRARY = FALSE
    MAX_JUNK = 0
    FIX_ACK_ID = TRUE
    FIX_NAME_CHECK = TRUE
    FIX_STALE_INC = TRUE
    FIX_PERSIST_SENT = TRUE
    FIX_FINOK_ACK = TRUE
    PI_DEDUP = TRUE
    PI_SHARES_BEFORE_FINISH = TRUE
INVARIANTS
    TypeOK SlotWellFormed OneRoomPerRun InOrder OnlyActiveInRooms
    WaitingNextBusy NoHandoverToBusy CompletedAllTimes TimesConsistent
    LeftNeverCompleted OutboxLive OutboxCurrent LeftOnlyIfSent
    LeftQueuedIfReceived NoShareToPassedRoom NoStaleAdopt DataExact
    NoMisapply NoPhantomRun AckOnlyDelivered LeftOnlyForOwn
PROPERTIES
    EnterStep RunsEndEA NoWaitEA OutboxEmptyEA NoGhostEA
CHECK_DEADLOCK TRUE
