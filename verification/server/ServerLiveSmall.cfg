    LEAVES = TRUE
    ARBITRARY = FALSE
    MAX_JUNK = 0
    FIX_ACK_ID = TRUE
    FIX_NAME_CHECK = TRUE
    FIX_STALE_INC = TRUE
    FIX_PERSIST_SENT = TRUE
    FIX_FINOK_ACK = TRUE
    PI_DEDUP = TRUE
    PI_SHARES_BEFORE_FINISH = TRUE
INVARIANTS
    TypeOK SlotWellFormed OneRoomPerRun InOrder OnlyActiveInRooms
    WaitingNextBusy NoHandoverToBusy CompletedAllTimes TimesConsistent
