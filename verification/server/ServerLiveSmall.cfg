    RUNS = 2
    KEYS <- KeysDefault
    TARGETS <- TgtDefault
    MAX_SHARES = 0
    MAX_RESTARTS = 0
    MAX_DISC = 0
    MAX_DROPS = 0
    MAX_DUPS = 0
